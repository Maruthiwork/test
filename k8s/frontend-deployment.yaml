apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: maruthi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/maruthi-k8s:latest
        ports:
        - containerPort: 3000
